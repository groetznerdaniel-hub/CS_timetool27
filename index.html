<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbeitszeiterfassung für CS Elektrotechnik</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFF00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS Arbeitszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--page:#FFFF00;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7380;--bd:#e1e4e8;--ac:#2563eb;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,input{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.bad{background:transparent;color:var(--bad);padding:4px 10px;font-size:1.2rem;font-weight:700;line-height:1}
.x{position:sticky;right:0;background:var(--card);text-align:right}
input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu);gap:3px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;text-align:center}
.big{font-size:1.5rem;font-weight:600}
.mu{color:var(--mu);font-size:.85rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:.8rem;color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}
.combo{position:relative;display:flex;align-items:stretch}
.combo input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0}
.dd{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-left:0;border-radius:0;padding:0 10px}
.combo .dd:last-of-type{border-radius:0 8px 8px 0}
.ddl{display:none;position:absolute;top:100%;left:0;min-width:100%;max-height:220px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.2);margin-top:2px}
.ddl div{padding:9px 12px;cursor:pointer;white-space:nowrap;color:var(--tx);font-size:1rem}
.ddl div:hover{background:var(--bg)}
.stamprow{display:flex;gap:10px}
.stamprow button{flex:1;padding:14px 10px;font-size:1.05rem;font-weight:600}
.sin{background:#16a34a}.sout{background:#dc2626}
.navbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.navbar button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;font-weight:600;font-size:.95rem}
.navbar button.on{background:#000;color:#FFFF00;border-color:#000}
.card textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;font:inherit;color:inherit;resize:vertical}
.imp h2{margin:0 0 8px;font-size:1.2rem}
.imp p{margin:0 0 12px}
.imp a{color:var(--ac)}
.row3{display:flex;gap:10px;margin-top:10px}
.row3 label{flex:1;min-width:0}
.row3 input{width:100%}
.phrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:var(--bg);display:block}
.ph .bad{position:absolute;top:-6px;right:-6px;background:var(--card);border:1px solid var(--bd);border-radius:50%;width:24px;height:24px;padding:0;font-size:.85rem;line-height:1}
td button.sec{padding:4px 8px}
.viewer{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;padding:12px}
.viewer img{display:block;max-width:100%;margin:0 auto 12px;border-radius:8px}
.viewer .vc{position:sticky;top:0;text-align:right;padding-bottom:8px}
.welcome{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--page);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
</style>
</head>

    <h2 style="margin:10px 0 6px;font-size:1.3rem">Willkommen</h2>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
function today(){const n=new Date();return n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate());}
function hm(){const n=new Date();return p2(n.getHours())+':'+p2(n.getMinutes());}
const KEY='az-data';
let D={name:'',rate:15,fpRate:12.5,entries:[],payouts:[]};
try{const r=localStorage.getItem(KEY);if(r)D=Object.assign(D,JSON.parse(r));}catch(e){}
D.name=D.name||D.sentName||'';
let impMsg='',rsT=null,page='erfassen',pend=null,fpOn=false,tab=1,month=today().slice(0,7),msg='',imp=[],open=null,dl=null;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){msg='Speichern im Browser nicht möglich.';}};
const tm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b;};
const wd=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'long'});
const fd=d=>d.split('-').reverse().join('.');
const fh=h=>{const neg=h<0,m=Math.round(Math.abs(h)*60);return(neg?'−':'')+Math.floor(m/60)+':'+p2(m%60)+' h';};
const work=e=>Math.max(0,tm(e.e)-tm(e.b)-(e.p||0)+0)/60;
const fe=v=>v.toFixed(2).replace('.',',')+' €';
const pay=e=>work(e)*D.rate+(e.fp?D.fpRate:0);
const sumPay=()=>D.entries.reduce((a,e)=>a+pay(e),0);
const sumW=()=>D.entries.reduce((a,e)=>a+work(e),0);
const sumP=()=>D.payouts.reduce((a,p)=>a+p.h,0);

function stSt(){const s=D.stamp,o=$('#st');if(!o)return;
  const t=s&&s.se&&s.e?'Ausgestempelt um '+s.e:(s&&s.st&&s.b?'Eingestempelt seit '+s.b:'');
  o.textContent=t+(t&&s.pm>0?' · Pause '+s.pm+' min':'');}
function stamp(kind){
  const now=hm(),S=D.stamp;
  if(kind=='in'){
    if(S&&S.d===today()&&S.b&&S.se&&S.e){
      const gap=tm(now)-tm(S.e);S.pm=(S.pm||0)+(gap>0?gap:0);S.st=1;S.se=0;S.e='';
    }else if(S&&S.d===today()&&S.st&&!S.se){}
    else{D.stamp={d:today(),b:now,st:1};useLocation(true);}
  }else{D.stamp=S||{};D.stamp.e=now;D.stamp.se=1;if(!D.stamp.d)D.stamp.d=today();}
  persist();
  if(!$('#b')){render();return;}
  $('#d').value=D.stamp.d;if(D.stamp.b)$('#b').value=D.stamp.b;$('#e').value=D.stamp.e||'16:00';
  if(D.stamp.pm!=null)$('#p').value=D.stamp.pm;
  stSt();
}
function resetForm(){
  (D.pph||[]).forEach(phDel);D.pph=[];D.stamp=null;fpOn=false;msg='';persist();render();
}
function showWelcome(){const w=$('#welcome');if(!w)return;w.style.display='flex';const i=$('#wn');if(i)setTimeout(()=>i.focus(),50);}
function welcomeSave(){
  const i=$('#wn'),v=i?i.value.trim():'';
  if(!v){const e=$('#wnerr');if(e)e.textContent='Bitte gib deinen Namen ein.';return;}
  D.name=v;persist();$('#welcome').style.display='none';render();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='wn')welcomeSave();});
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function backupSave(){
  const ids=[...new Set(D.entries.flatMap(e=>e.ph||[]).concat(D.pph||[]))],photos={};
  for(const id of ids){try{const b=await phGet(id);if(b)photos[id]=await blobToData(b);}catch(e){}}
  const data=JSON.stringify({app:'cs-arbeitszeit',version:1,saved:new Date().toISOString(),name:D.name,rate:D.rate,fpRate:D.fpRate,entries:D.entries,payouts:D.payouts,photos});
  try{await saveFile({filename:'datensicherung-'+today()+'.json',data,mime:'application/json'});}catch(e){impMsg='Sicherung nicht möglich.';render();}
}
function parseCsvRows(t){const R=[];let r=[],c='',iq=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(iq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++;}else iq=false;}else c+=ch;}
    else if(ch=='"')iq=true;else if(ch==';'){r.push(c);c='';}
    else if(ch=='\n'){r.push(c.replace(/\r$/,''));R.push(r);r=[];c='';}else c+=ch;}
  if(c||r.length){r.push(c);R.push(r);}return R;}
const numDe=v=>{const x=parseFloat(String(v||'').replace(',','.'));return isNaN(x)?0:x;};
async function importData(file){
  let txt;try{txt=await file.text();}catch(e){impMsg='Die Datei konnte nicht gelesen werden.';return render();}
  const esig=e=>[e.d,e.b,e.e,e.ort||'',e.tat||''].join('|'),psig=x=>[x.d,x.h,x.fp||0,x.n||''].join('|');
  const have=new Set(D.entries.map(esig)),haveP=new Set(D.payouts.map(psig)),empty=!D.entries.length&&!D.payouts.length;
  let ne=0,np=0,nf=0;
  try{
    if(/\.json$/i.test(file.name)||txt.trim().startsWith('{')){
      const j=JSON.parse(txt);if(j.app!=='cs-arbeitszeit')throw new Error('format');
      if(empty){if(j.rate>=0)D.rate=j.rate;if(j.fpRate>=0)D.fpRate=j.fpRate;}
      if(!D.name&&j.name)D.name=String(j.name);
      const ids=new Set(D.entries.map(e=>e.id));
      for(const e of j.entries||[]){
        if(ids.has(e.id)||have.has(esig(e)))continue;
        const en={...e};D.entries.push(en);have.add(esig(en));ne++;
        for(const pid of e.ph||[]){const u=(j.photos||{})[pid];if(u){try{const b=await (await fetch(u)).blob();await phPut(pid,b);nf++;}catch(x){}}}
      }
      const pids=new Set(D.payouts.map(x=>x.id));
      for(const x of j.payouts||[]){if(pids.has(x.id)||haveP.has(psig(x)))continue;D.payouts.push({...x});haveP.add(psig(x));np++;}
    }else{
      const R=parseCsvRows(txt),H=R[0]||[],c=n=>H.indexOf(n);
      if(c('Typ')<0||c('Datum')<0||c('Beginn')<0)throw new Error('format');
      let first=true;
      for(let k=1;k<R.length;k++){const x=R[k];if(x.length<8||!x[c('Datum')])continue;
        if(first){first=false;if(empty){const rt=numDe(x[c('Stundenlohn (€)')]),fr=numDe(x[c('Fahrpauschale (€)')]);if(rt>0)D.rate=rt;if(fr>0)D.fpRate=fr;}if(!D.name&&x[c('Mitarbeiter')])D.name=x[c('Mitarbeiter')];}
        if(x[c('Typ')]=='Arbeit'){
          const e={id:'i'+Date.now()+'_'+k,d:x[c('Datum')],ort:x[c('Ort')]||'',tat:x[c('Tätigkeit')]||'',b:x[c('Beginn')],e:x[c('Ende')],p:Math.round(numDe(x[c('Pause (min)')])),fp:x[c('Fahrpauschale')]=='Ja'};
          if(!/^\d{4}-\d{2}-\d{2}$/.test(e.d)||!e.b||!e.e||have.has(esig(e)))continue;D.entries.push(e);have.add(esig(e));ne++;
        }else if(x[c('Typ')]=='Auszahlung'){
          const p={id:'ip'+Date.now()+'_'+k,d:x[c('Datum')],h:Math.max(0,-numDe(x[c('Arbeitszeit (h)')])),fp:Math.abs(parseInt(x[c('Fahrpauschale')])||0),n:x[c('Tätigkeit')]||''};
          if(!/^\d{4}-\d{2}-\d{2}$/.test(p.d)||haveP.has(psig(p)))continue;D.payouts.push(p);haveP.add(psig(p));np++;
        }
      }
    }
  }catch(e){impMsg='Die Datei passt nicht. Erwartet wird eine Datensicherung (.json) oder eine CSV-Datei aus dieser App.';return render();}
  persist();
  impMsg=(ne||np)?ne+' Einträge und '+np+' Auszahlungen übernommen'+(nf?' ('+nf+' Fotos)':'')+'.':'Es gab nichts Neues zu übernehmen.';
  render();
}
function addEntry(){
  const d=$('#d').value,b=$('#b').value,e=$('#e').value;
  if(!d||!b||!e||tm(e)<=tm(b)){msg='Bitte Datum, Beginn und Ende angeben (Ende nach Beginn).';return render();}
  D.entries.push({id:String(Date.now()),d,ort:$('#o').value.trim(),tat:$('#t').value.trim(),b,e,p:+$('#p').value||0,fp:fpOn,ph:(D.pph||[]).slice()});D.pph=[];
  fpOn=false;D.stamp=null;msg='';persist();render();
}
function addPayout(){
  const h=parseFloat(String($('#ph').value).replace(',','.'))||0,f=parseInt($('#pf').value)||0,d=$('#pd').value;
  if(!(h>0||f>0)||!d){msg='Bitte Datum sowie Stunden und/oder Fahrpauschalen für die Auszahlung angeben.';return render();}
  D.payouts.push({id:String(Date.now()),d,h,fp:f,n:$('#pn').value.trim()});msg='';persist();render();
}
async function saveFile(o){
  if(!o.plain&&window.showSaveFilePicker){try{
    const mime=o.mime||'text/csv',ext=o.filename.slice(o.filename.lastIndexOf('.'));
    const h=await showSaveFilePicker({suggestedName:o.filename,types:[{description:ext=='.json'?'Datensicherung':'CSV-Datei',accept:{[mime]:[ext]}}]});
    const w=await h.createWritable();await w.write(o.data);await w.close();return;}
  catch(e){if(e&&e.name=='AbortError')return;}}
  const blob=new Blob([o.data],{type:(o.mime||'text/csv')+';charset=utf-8'});
  try{const f=new File([blob],o.filename,{type:o.mime||'text/csv'});
    if(!o.plain&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e&&e.name=='AbortError')return;}

const NAV_TOP=[['erfassen','Erfassen'],['uebersicht','Übersicht'],['auszahlungen','Auszahlungen']],NAV_BOT=[['einstellungen','Einstellungen'],['impressum','Impressum']];
const navHtml=a=>a.map(([k,n])=>'<button data-page="'+k+'"'+(k==page?' class="on"':'')+'>'+n+'</button>').join('');
function render(){

let idbp=null;
function idb(){return idbp||(idbp=new Promise((res,rej)=>{const q=indexedDB.open('az-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
async function phPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function phGet(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function phDel(id){try{const d=await idb();return new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=res;});}catch(e){}}
function shrink(file,max){max=max||1280;return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.78);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};img.src=u;});}
const thumbUrls=[];
async function fillThumbs(){thumbUrls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  for(const im of document.querySelectorAll('img[data-ph]')){try{const b=await phGet(im.dataset.ph);if(b){const u=URL.createObjectURL(b);thumbUrls.push(u);im.src=u;}}catch(e){}}}
function pendHtml(){return (D.pph||[]).map(id=>'<span class="ph"><img data-ph="'+id+'" alt=""><button type="button" class="bad" data-phdel="'+id+'" aria-label="Foto entfernen">✕</button></span>').join('');}
function renderPending(){const el=$('#pph');if(el){el.innerHTML=pendHtml();fillThumbs();}}
async function addPhotos(files){
  let n=0;setGeo('Fotos werden verarbeitet …');
  for(const f of files){try{const b=await shrink(f);const id='p'+Date.now()+'_'+Math.random().toString(36).slice(2,7);await phPut(id,b);(D.pph=D.pph||[]).push(id);n++;}catch(e){}}
  persist();renderPending();setGeo(n?'':'Foto konnte nicht gespeichert werden.');
}
async function viewPhotos(id){
  const en=D.entries.find(x=>x.id===id);if(!en||!en.ph||!en.ph.length)return;
  const v=$('#viewer');v.innerHTML='<div class="vc"><button type="button" data-vclose="1">Schließen</button></div>';v.style.display='block';
  for(const ph of en.ph){try{const b=await phGet(ph);if(b){const im=new Image();im.src=URL.createObjectURL(b);im.alt='';v.appendChild(im);}}catch(e){}}
}
function setGeo(t){const g=$('#gst');if(g)g.textContent=t;}
function useLocation(auto){
  const cur=$('#o');if(auto&&cur&&cur.value.trim())return;
  if(!navigator.geolocation){setGeo('Dieses Gerät unterstützt keine Standortabfrage.');return;}
  setGeo('Standort wird ermittelt …');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la=pos.coords.latitude,lo=pos.coords.longitude;let txt=la.toFixed(5)+', '+lo.toFixed(5);
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=de&lat='+la+'&lon='+lo);
      if(r.ok){const j=await r.json(),a=j.address||{};
        const street=[a.road||a.pedestrian||a.path||'',a.house_number||''].filter(Boolean).join(' ');
        const t=[street,a.city||a.town||a.village||a.municipality||''].filter(Boolean).join(', ');if(t)txt=t;}
    }catch(e){}
    const o=$('#o');if(!(auto&&o&&o.value.trim())){if(o)o.value=txt;if(D.stamp){D.stamp.o=txt;persist();}}setGeo('');
  },err=>{setGeo(err&&err.code==1?'Standortfreigabe verweigert. Bitte in den Einstellungen des Geräts erlauben.':'Standort konnte nicht ermittelt werden.');},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function toggleDD(id){const l=$('#ddl-'+id);if(!l)return;
  if(l.style.display==='block'){l.style.display='none';return;}
  const key=id=='o'?'ort':'tat',cnt={};D.entries.forEach(e=>{const v=(e[key]||'').trim();if(v)cnt[v]=(cnt[v]||0)+1;});
  const vals=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  l.innerHTML=vals.length?vals.map(v=>`<div data-v="${esc(v)}">${esc(v)}</div>`).join(''):'<div class="mu" style="cursor:default">Noch keine Einträge</div>';
  l.style.display='block';}
document.addEventListener('click',e=>{
  const op=e.target.closest('.ddl [data-v]');
  if(op){const l=op.parentNode;$('#'+l.id.slice(4)).value=op.dataset.v;l.style.display='none';return;}
  if(e.target.closest('[data-geo]')){useLocation();return;}
  const dd=e.target.closest('[data-dd]');
  document.querySelectorAll('.ddl').forEach(l=>{if(!dd||l.id!=='ddl-'+dd.dataset.dd)l.style.display='none';});
  if(dd){toggleDD(dd.dataset.dd);return;}
  const t=e.target.closest('button,tr.cl');if(!t){if(pend){pend=null;render();}return;}
  if(t.id=='wgo'){welcomeSave();}
  else if(t.id=='bsave')backupSave();
  else if(t.id=='bload'){impMsg='';$('#impin').click();}
  else if(t.id=='resetf'){
    if(rsT){clearTimeout(rsT);rsT=null;resetForm();}
    else{t.textContent='Zurücksetzen?';t.style.cssText='color:var(--bad);border-color:var(--bad);font-size:.95rem;padding:4px 10px';
      rsT=setTimeout(()=>{rsT=null;const b=$('#resetf');if(b){b.textContent='↺';b.style.cssText='font-size:1.1rem;padding:4px 10px';}},3500);}
  }
  else if(t.dataset.photo){$('#phin').click();}
  else if(t.dataset.phdel){D.pph=(D.pph||[]).filter(x=>x!==t.dataset.phdel);phDel(t.dataset.phdel);persist();renderPending();}
  else if(t.dataset.phview)viewPhotos(t.dataset.phview);
  else if(t.dataset.vclose){const v=$('#viewer');v.style.display='none';v.innerHTML='';}
  else if(t.dataset.page){page=t.dataset.page;msg='';pend=null;render();try{window.scrollTo(0,0);}catch(x){}}
  else if(t.id=='gonm'){page='einstellungen';render();}
  else if(t.id=='sin')stamp('in');else if(t.id=='sout')stamp('out');else if(t.id=='add')addEntry();else if(t.id=='addp')addPayout();else if(t.id=='csv')exportCsv();else if(t.id=='send')sendTo();
  else if(t.id=='fp'){fpOn=!fpOn;t.className=fpOn?'':'sec';t.textContent=(fpOn?'✓ ':'')+'Fahrpauschale';}
  else if(t.dataset.de){if(pend==='e'+t.dataset.de){{const en=D.entries.find(x=>x.id===t.dataset.de);((en&&en.ph)||[]).forEach(phDel);}D.entries=D.entries.filter(x=>x.id!==t.dataset.de);pend=null;persist();}else pend='e'+t.dataset.de;render();}
  else if(t.dataset.dp){if(pend==='p'+t.dataset.dp){D.payouts=D.payouts.filter(x=>x.id!==t.dataset.dp);pend=null;persist();}else pend='p'+t.dataset.dp;render();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id=='impin'){if(t.files&&t.files[0])importData(t.files[0]);t.value='';}
  else if(t.id=='phin'){if(t.files&&t.files.length)addPhotos([...t.files]);t.value='';}
  else if(t.id=='d'||t.id=='b'||t.id=='e'||t.id=='o'){if(D.stamp){D.stamp[t.id]=t.value;persist();stSt();}}
  else if(t.id=='p'){if(D.stamp){D.stamp.pm=Math.max(0,parseInt(t.value)||0);persist();stSt();}}
  else if(t.id=='mon'&&t.value){month=t.value;render();}
  else if(t.id=='rt'||t.id=='fr'){const v=parseFloat(String(t.value).replace(',','.'));if(v>=0){D[t.id=='rt'?'rate':'fpRate']=v;persist();}render();}
  else if(t.id=='nm'){D.name=t.value.trim();persist();}
  else if(t.id=='cm'){D.msg=t.value;persist();}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
if(!(D.name||'').trim())showWelcome();
</script>
</body>
</html>
